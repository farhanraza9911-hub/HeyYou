<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HeyYou Admin Password Reset</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f5f7;font-family:Arial,sans-serif;color:#222}
.box{width:min(440px,92vw);background:#fff;padding:30px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
h1{margin:0 0 8px;text-align:center;color:#128c7e}.sub{text-align:center;color:#777;margin-bottom:22px}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:8px;background:#128c7e;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}.step{margin-top:10px}.hidden{display:none}#msg{min-height:22px;text-align:center;margin-top:15px;color:#d00}.success{color:#087f42!important}
.back{text-align:center;margin-top:16px}.back a{color:#128c7e;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>Admin Password Reset</h1>
<div class="sub">Reset the administrator password by email OTP</div>
<div id="step1" class="step">
<input id="email" type="email" placeholder="Admin email" autocomplete="username">
<button id="send" onclick="sendOtp()">Send OTP</button>
</div>
<div id="step2" class="step hidden">
<input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP">
<button id="verify" onclick="verifyOtp()">Verify OTP</button>
</div>
<div id="step3" class="step hidden">
<input id="password" type="password" placeholder="New admin password (minimum 8 characters)" autocomplete="new-password">
<input id="confirm" type="password" placeholder="Confirm new password" autocomplete="new-password">
<button id="reset" onclick="resetPassword()">Set New Password</button>
</div>
<div id="msg"></div>
<div class="back"><a href="/admin">Back to Admin Login</a></div>
</div>
<script>
let email="",token="";
const msg=document.getElementById("msg");
function setMsg(t,ok=false){msg.textContent=t;msg.className=ok?"success":""}
function busy(id,v,label){const b=document.getElementById(id);b.disabled=v;if(v){b.dataset.old=b.textContent;b.textContent=label}else b.textContent=b.dataset.old||b.textContent}
async function json(r){return r.json().catch(()=>({}))}
async function sendOtp(){
 email=document.getElementById("email").value.trim().toLowerCase();
 if(!email){setMsg("Enter the admin email.");return}
 busy("send",true,"Sending OTP...");
 try{const r=await fetch("/api/admin/password-reset/request",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email})});const d=await json(r);if(!r.ok){setMsg(d.error||"Could not send OTP.");return}document.getElementById("step1").classList.add("hidden");document.getElementById("step2").classList.remove("hidden");setMsg(d.message||"OTP sent.",true);document.getElementById("otp").focus()}catch(e){setMsg("Server connection error.")}finally{busy("send",false)}
}
async function verifyOtp(){
 const otp=document.getElementById("otp").value.trim();if(!/^\d{6}$/.test(otp)){setMsg("Enter the 6-digit OTP.");return}
 busy("verify",true,"Verifying...");
 try{const r=await fetch("/api/admin/password-reset/verify",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email,otp})});const d=await json(r);if(!r.ok){setMsg(d.error||"Invalid OTP.");return}token=d.resetToken||"";document.getElementById("step2").classList.add("hidden");document.getElementById("step3").classList.remove("hidden");setMsg("OTP verified. Enter your new password.",true);document.getElementById("password").focus()}catch(e){setMsg("Server connection error.")}finally{busy("verify",false)}
}
async function resetPassword(){
 const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
 if(password.length<8){setMsg("Admin password must be at least 8 characters.");return}
 if(password!==confirm){setMsg("Passwords do not match.");return}
 if(!token){setMsg("Verify the OTP first.");return}
 busy("reset",true,"Saving...");
 try{const r=await fetch("/api/admin/password-reset/complete",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email,resetToken:token,password})});const d=await json(r);if(!r.ok){setMsg(d.error||"Could not reset password.");return}setMsg("Admin password reset successfully. Redirecting...",true);setTimeout(()=>location.href="/admin",1000)}catch(e){setMsg("Server connection error.")}finally{busy("reset",false)}
}
</script>
</body>
</html>
