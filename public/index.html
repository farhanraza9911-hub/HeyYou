<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyYou - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #128c7e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #d00;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">HeyYou</div>

    <div class="subtitle">
        Messaging & Video Calling
    </div>

    <form id="loginForm">

  <input
    type="text"
    id="email"
    placeholder="Email or Mobile Number"
    required
>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>
<p style="text-align:center; margin-top:20px;">
    Don't have an account?
    <a href="/register.html" style="color:#128c7e; font-weight:bold;">
        Register
    </a>
</p>

    <p id="message"></p>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });

        const data = await response.json();

        if (data.error) {

            document.getElementById("message").innerText = data.error;

        } else {

            document.getElementById("message").style.color = "green";
            document.getElementById("message").innerText = "Login successful!";

            setTimeout(function() {

                window.location.href = "/home.html";

            }, 500);

        }

    } catch (error) {

        document.getElementById("message").innerText =
            "Server connection error.";

        console.log(error);

    }

});

</script>

</body>
</html>
