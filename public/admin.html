<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HeyYou Admin Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f7;
    color:#222;
}

.header{
    background:#128c7e;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
    font-size:22px;
}

.logout{
    background:white;
    color:#128c7e;
    border:0;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    padding:25px;
}

.cards{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:12px;
    padding:22px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card-title{
    color:#777;
    font-size:14px;
}

.card-value{
    font-size:30px;
    font-weight:bold;
    margin-top:8px;
}

.panel{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.panel h2{
    margin-top:0;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#f7f7f7;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#eee;
    font-size:12px;
}

.badge.admin{
    background:#128c7e;
    color:white;
}

.badge.online{
    background:#d9f8e8;
    color:#087f42;
}

button.action{
    border:0;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    margin-right:5px;
}

.refresh{
    background:#128c7e;
    color:white;
}

.danger{
    background:#dc3545;
    color:white;
}

</style>
</head>

<body>

<div class="header">

    <h1>
        HeyYou Admin Dashboard
    </h1>

    <button
        class="logout"
        onclick="logout()"
    >
        Logout
    </button>

</div>


<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">
                Total Users
            </div>

            <div
                class="card-value"
                id="totalUsers"
            >
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Online Users
            </div>

            <div
                class="card-value"
                id="onlineUsers"
            >
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Admins
            </div>

            <div
                class="card-value"
                id="totalAdmins"
            >
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Reports
            </div>

            <div
                class="card-value"
                id="totalReports"
            >
                0
            </div>
        </div>

    </div>


    <div class="panel">

        <h2>
            Users
        </h2>

        <button
            class="action refresh"
            onclick="loadDashboard()"
        >
            Refresh
        </button>

        <br><br>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>

                    </tr>

                </thead>

                <tbody id="usersTable">

                    <tr>
                        <td colspan="6">
                            Loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <div class="panel">

        <h2>
            Reports
        </h2>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Reporter</th>
                        <th>Target</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Created</th>

                    </tr>

                </thead>

                <tbody id="reportsTable">

                    <tr>
                        <td colspan="6">
                            Loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

async function loadDashboard(){

    try{

        const usersResponse =
            await fetch(
                "/api/admin/users"
            );


        if(
            usersResponse.status === 401
        ){

            location.href = "/";

            return;

        }


        if(
            usersResponse.status === 403
        ){

            document.body.innerHTML =
                "<h2 style='padding:30px'>Admin access required.</h2>";

            return;

        }


        if(
            !usersResponse.ok
        ){

            throw new Error(
                "Could not load users"
            );

        }


        const users =
            await usersResponse.json();


        const reportsResponse =
            await fetch(
                "/api/admin/reports"
            );


        const reports =
            reportsResponse.ok
                ?
                await reportsResponse.json()
                :
                [];


        document.getElementById(
            "totalUsers"
        ).textContent =
            users.length;


        document.getElementById(
            "onlineUsers"
        ).textContent =

            users.filter(
                user =>
                    user.status === "online"
            ).length;


        document.getElementById(
            "totalAdmins"
        ).textContent =

            users.filter(
                user =>
                    user.role === "admin"
            ).length;


        document.getElementById(
            "totalReports"
        ).textContent =
            reports.length;


        renderUsers(
            users
        );


        renderReports(
            reports
        );

    }catch(error){

        console.error(
            "Admin dashboard:",
            error
        );

        alert(
            "Could not load admin dashboard."
        );

    }

}


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function renderUsers(
    users
){

    const table =
        document.getElementById(
            "usersTable"
        );


    table.innerHTML =
        "";


    if(
        !users.length
    ){

        table.innerHTML =
            `
            <tr>
                <td colspan="6">
                    No users found.
                </td>
            </tr>
            `;

        return;

    }


    users.forEach(
        user => {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML =
                `

                <td>
                    ${escapeHtml(user.id)}
                </td>

                <td>
                    ${escapeHtml(user.name)}
                </td>

                <td>
                    ${escapeHtml(user.email)}
                </td>

                <td>

                    <span class="badge ${
                        user.role === "admin"
                            ? "admin"
                            : ""
                    }">

                        ${escapeHtml(
                            user.role
                        )}

                    </span>

                </td>

                <td>

                    <span class="badge ${
                        user.status === "online"
                            ? "online"
                            : ""
                    }">

                        ${escapeHtml(
                            user.status
                        )}

                    </span>

                </td>

                <td>
                    ${
                        user.created_at
                            ?
                        new Date(
                            user.created_at
                        ).toLocaleString()
                            :
                        ""
                    }
                </td>

                `;


            table.appendChild(
                row
            );

        }
    );

}


function renderReports(
    reports
){

    const table =
        document.getElementById(
            "reportsTable"
        );


    table.innerHTML =
        "";


    if(
        !reports.length
    ){

        table.innerHTML =
            `
            <tr>
                <td colspan="6">
                    No reports.
                </td>
            </tr>
            `;

        return;

    }


    reports.forEach(
        report => {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML =
                `

                <td>
                    ${escapeHtml(report.id)}
                </td>

                <td>
                    ${escapeHtml(
                        report.reporter_id
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        report.target_id
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        report.reason
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        report.status
                    )}
                </td>

                <td>
                    ${
                        report.created_at
                            ?
                        new Date(
                            report.created_at
                        ).toLocaleString()
                            :
                        ""
                    }
                </td>

                `;


            table.appendChild(
                row
            );

        }
    );

}


async function logout(){

    try{

        await fetch(
            "/api/logout",
            {
                method:
                    "POST"
            }
        );

    }catch(error){

        console.error(
            error
        );

    }


    location.href =
        "/";

}


loadDashboard();

</script>

</body>
</html>
