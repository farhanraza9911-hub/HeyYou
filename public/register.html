<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeyYou - Register</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
}

.register-box {
    width: 380px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    color: #128c7e;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #128c7e;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.login-link {
    text-align: center;
    margin-top: 20px;
}

.login-link a {
    color: #128c7e;
    text-decoration: none;
}

#message {
    text-align: center;
    margin-top: 15px;
    min-height: 20px;
}
</style>
</head>

<body>

<div class="register-box">

    <div class="logo">HeyYou</div>

    <div class="subtitle">
        Create your account
    </div>

    <form id="registerForm">

        <div id="registerFields">
            <input type="text" id="name" placeholder="Full Name" required>

            <input type="email" id="email" required placeholder="Gmail / Email" autocomplete="email">

            <div style="display:flex;gap:8px;margin-bottom:15px">
                <select id="countryCode" required style="width:115px;padding:13px 8px;border:1px solid #ddd;border-radius:8px;font-size:15px;background:#fff">
                    <option value="+92" selected>🇵🇰 +92</option>
                    <option value="+966">🇸🇦 +966</option>
                    <option value="+971">🇦🇪 +971</option>
                    <option value="+974">🇶🇦 +974</option>
                    <option value="+965">🇰🇼 +965</option>
                    <option value="+973">🇧🇭 +973</option>
                    <option value="+968">🇴🇲 +968</option>
                    <option value="+91">🇮🇳 +91</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+44">🇬🇧 +44</option>
                </select>
                <input type="tel" id="phone" required placeholder="Mobile Number" style="flex:1;margin-bottom:0" autocomplete="tel">
            </div>

            <input type="password" id="password" placeholder="Password (minimum 6 characters)" minlength="6" required autocomplete="new-password">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" minlength="6" required autocomplete="new-password">
            <button type="button" id="sendOtpBtn" onclick="requestRegistrationOtp()">Send Gmail OTP</button>
        </div>

        <div id="otpStep" style="display:none">
            <div style="font-weight:700;margin:8px 0">Verify your Gmail</div>
            <p style="font-size:13px;color:#777">Enter the 6-digit OTP sent to your email.</p>
            <input type="text" id="registerOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit OTP">
            <button type="button" id="verifyRegisterBtn" onclick="verifyRegistrationOtp()">Verify & Create Account</button>
        </div>

    </form>

    <p id="message"></p>

    <div class="login-link">
        Already have an account?
        <a href="/">Login</a>
    </div>

</div>

<script>
let registrationEmail = "";

function setMessage(text, color="#d00") {
    const message = document.getElementById("message");
    message.style.color = color;
    message.innerText = text || "";
}

function setBusy(id, busy, label) {
    const button = document.getElementById(id);
    if (!button) return;
    button.disabled = busy;
    if (busy) { button.dataset.oldText = button.textContent; button.textContent = label; }
    else if (button.dataset.oldText) button.textContent = button.dataset.oldText;
}

async function requestRegistrationOtp() {
    const name = document.getElementById("name").value.trim();
    registrationEmail = document.getElementById("email").value.trim().toLowerCase();
    const countryCode = document.getElementById("countryCode").value;
    const rawPhone = document.getElementById("phone").value.trim();
    const phoneDigits = rawPhone.replace(/\D/g, "").replace(/^0+/, "");
    const phone = countryCode + phoneDigits;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!name || !registrationEmail || !phoneDigits || !password || !confirmPassword) { setMessage("Name, Gmail/email, mobile number and password are required."); return; }
    if (password.length < 6) { setMessage("Password must be at least 6 characters."); return; }
    if (password !== confirmPassword) { setMessage("Passwords do not match."); return; }

    setBusy("sendOtpBtn", true, "Sending OTP...");
    setMessage("Sending verification OTP...", "#555");
    try {
        const response = await fetch("/api/register/request-otp", {
            method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
            body:JSON.stringify({name,email:registrationEmail,phone,password})
        });
        const data = await response.json().catch(()=>({}));
        if (!response.ok) { setMessage(data.error || "Could not send OTP."); return; }
        document.getElementById("registerFields").style.display = "none";
        document.getElementById("otpStep").style.display = "block";
        document.getElementById("registerOtp").focus();
        setMessage(data.message || "OTP sent to your Gmail.", "green");
    } catch (error) { console.error(error); setMessage("Server connection error."); }
    finally { setBusy("sendOtpBtn", false); }
}

async function verifyRegistrationOtp() {
    const otp = document.getElementById("registerOtp").value.trim();
    if (!/^\d{6}$/.test(otp)) { setMessage("Enter the 6-digit OTP."); return; }
    setBusy("verifyRegisterBtn", true, "Verifying...");
    try {
        const response = await fetch("/api/register/verify", {
            method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
            body:JSON.stringify({email:registrationEmail,otp})
        });
        const data = await response.json().catch(()=>({}));
        if (!response.ok) { setMessage(data.error || "Invalid OTP."); return; }
        setMessage("Account created successfully!", "green");
        setTimeout(()=>{ window.location.href="/home.html"; }, 500);
    } catch (error) { console.error(error); setMessage("Server connection error."); }
    finally { setBusy("verifyRegisterBtn", false); }
}
</script>

</body>
</html>
