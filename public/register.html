<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeyYou - Register</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
}

.register-box {
    width: 380px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    color: #128c7e;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #128c7e;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.login-link {
    text-align: center;
    margin-top: 20px;
}

.login-link a {
    color: #128c7e;
    text-decoration: none;
}

#message {
    text-align: center;
    margin-top: 15px;
    min-height: 20px;
}
</style>
</head>

<body>

<div class="register-box">

    <div class="logo">HeyYou</div>

    <div class="subtitle">
        Create your account
    </div>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <input
    type="email"
    id="email"
    placeholder="Gmail / Email (optional)"
>
<input
    type="tel"
    id="phone"
    placeholder="Mobile Number (e.g. +923001234567)"
>

        <input
            type="password"
            id="password"
            placeholder="Password (minimum 6 characters)"
            minlength="6"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            minlength="6"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <p id="message"></p>

    <div class="login-link">
        Already have an account?
        <a href="/">Login</a>
    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        const name =
            document.getElementById("name").value.trim();

const phone =
    document.getElementById("phone").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");

        message.style.color = "#d00";
if (!email && !phone) {
    message.innerText =
        "Please enter Gmail/email or mobile number.";

    return;
}

        if (password !== confirmPassword) {

            message.innerText =
                "Passwords do not match.";

            return;
        }

        if (password.length < 6) {

            message.innerText =
                "Password must be at least 6 characters.";

            return;
        }

        try {

            const response = await fetch(
                "/api/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                   body: JSON.stringify({
    name: name,
    email: email,
    phone: phone,
    password: password
})
                }
            );

            const data =
                await response.json();

            if (!response.ok || data.error) {

                message.innerText =
                    data.error || "Registration failed.";

                return;
            }

            message.style.color = "green";

            message.innerText =
                "Account created successfully!";

            setTimeout(function() {

                window.location.href =
                    "/home.html";

            }, 800);

        } catch(error) {

            console.log(error);

            message.innerText =
                "Server connection error.";

        }

    }
);

</script>

</body>
</html>
