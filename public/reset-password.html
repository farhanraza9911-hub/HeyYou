<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeyYou - Reset Password</title><style>body{font-family:Arial;background:#f2f5f8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{width:360px;max-width:92%;background:#fff;padding:30px;border-radius:15px;box-shadow:0 5px 25px #0002}h2{text-align:center}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #ddd}button{background:#128c7e;color:#fff;border:0;cursor:pointer}.hidden{display:none}.msg{text-align:center;margin-top:10px}</style></head><body><div class="box"><h2>Reset Password</h2><div id="step1"><input id="email" type="email" placeholder="Gmail / Email" required><button onclick="requestOtp()">Send OTP</button></div><div id="step2" class="hidden"><input id="otp" placeholder="6-digit OTP" inputmode="numeric" maxlength="6"><button onclick="verifyOtp()">Verify OTP</button></div><div id="step3" class="hidden"><input id="password" type="password" placeholder="New password" minlength="6"><input id="confirm" type="password" placeholder="Confirm new password" minlength="6"><button onclick="resetPassword()">Reset Password</button></div><div class="msg" id="msg"></div><p style="text-align:center"><a href="/">Back to Login</a></p></div><script>let email="",token="";const msg=t=>document.getElementById("msg").textContent=t;async function requestOtp(){try{email=document.getElementById("email").value.trim();if(!email){msg("Enter your email first.");return}const r=await fetch("/api/password-reset/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});let d={};try{d=await r.json()}catch(e){}if(!r.ok){msg(d.error||"Could not send OTP");return}document.getElementById("step1").classList.add("hidden");document.getElementById("step2").classList.remove("hidden");document.getElementById("otp").focus();msg("OTP sent to your email. Check Gmail inbox/spam.");}catch(e){console.error(e);msg("Could not connect to server. Please try again.");}}async function verifyOtp(){const otp=document.getElementById("otp").value.trim();const r=await fetch("/api/password-reset/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,otp})});const d=await r.json();if(!r.ok){msg(d.error||"Invalid OTP");return}token=d.resetToken;document.getElementById("step2").classList.add("hidden");document.getElementById("step3").classList.remove("hidden");msg("OTP verified. Set your new password.");}async function resetPassword(){const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm){msg("Passwords do not match.");return}const r=await fetch("/api/password-reset/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,resetToken:token,password})});const d=await r.json();if(!r.ok){msg(d.error||"Could not reset password");return}msg("Password reset successfully.");setTimeout(()=>location.href="/",800);}</script></body></html>
