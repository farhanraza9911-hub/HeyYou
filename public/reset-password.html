<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeyYou - Reset Password</title>
<style>
body{font-family:Arial;background:#f2f5f8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{width:360px;max-width:92%;background:#fff;padding:30px;border-radius:15px;box-shadow:0 5px 25px #0002}
h2{text-align:center}
input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #ddd}
button{background:#128c7e;color:#fff;border:0;cursor:pointer;font-weight:700}
button:disabled{opacity:.65;cursor:wait}
.hidden{display:none!important}
.msg{text-align:center;margin-top:10px;min-height:22px;line-height:1.4}
.success{color:#128c7e}.error{color:#c62828}
.step-title{font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<h2>Reset Password</h2>

<div id="step1">
  <div class="step-title">1. Send OTP</div>
  <input id="email" type="email" placeholder="Gmail / Email" autocomplete="email" required>
  <button id="sendOtpBtn" type="button" onclick="requestOtp()">Send OTP</button>
</div>

<div id="step2" class="hidden">
  <div class="step-title">2. Enter OTP</div>
  <input id="otp" type="text" placeholder="6-digit OTP" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
  <button id="verifyOtpBtn" type="button" onclick="verifyOtp()">Verify OTP</button>
</div>

<div id="step3" class="hidden">
  <div class="step-title">3. Create New Password</div>
  <input id="password" type="password" placeholder="New password" minlength="6" autocomplete="new-password">
  <input id="confirm" type="password" placeholder="Confirm new password" minlength="6" autocomplete="new-password">
  <button id="resetBtn" type="button" onclick="resetPassword()">Reset Password</button>
</div>

<div class="msg" id="msg" aria-live="polite"></div>
<p style="text-align:center"><a href="/">Back to Login</a></p>
</div>

<script>
let email="";
let token="";

function setMsg(text, type=""){
  const el=document.getElementById("msg");
  el.textContent=text||"";
  el.className="msg"+(type?" "+type:"");
}

function setBusy(id,busy,label){
  const btn=document.getElementById(id);
  if(!btn)return;
  btn.disabled=busy;
  if(busy){btn.dataset.oldText=btn.textContent;btn.textContent=label;}
  else if(btn.dataset.oldText){btn.textContent=btn.dataset.oldText;}
}

async function readResponse(response){
  try{return await response.json();}
  catch(e){return {};}
}

async function requestOtp(){
  email=document.getElementById("email").value.trim().toLowerCase();
  if(!email){setMsg("Enter your email first.","error");return;}

  setBusy("sendOtpBtn",true,"Sending OTP...");
  setMsg("Connecting to HeyYou server...");
  try{
    const response=await fetch("/api/password-reset/request",{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify({email})
    });
    const data=await readResponse(response);
    if(!response.ok){
      setMsg(data.error||("Server error ("+response.status+") while sending OTP."),"error");
      return;
    }

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
    setMsg(data.message||"OTP sent. Check your Gmail inbox and spam folder.","success");
    const otp=document.getElementById("otp");
    otp.value="";
    setTimeout(()=>otp.focus(),50);
  }catch(error){
    console.error("Request OTP:",error);
    setMsg("Could not connect to the server. Make sure HeyYou is running and try again.","error");
  }finally{
    setBusy("sendOtpBtn",false);
  }
}

async function verifyOtp(){
  const otp=document.getElementById("otp").value.trim();
  if(!/^\d{6}$/.test(otp)){setMsg("Enter the 6-digit OTP.","error");return;}
  setBusy("verifyOtpBtn",true,"Verifying...");
  try{
    const response=await fetch("/api/password-reset/verify",{
      method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},credentials:"same-origin",
      body:JSON.stringify({email,otp})
    });
    const data=await readResponse(response);
    if(!response.ok){setMsg(data.error||"Invalid OTP.","error");return;}
    token=data.resetToken||"";
    if(!token){setMsg("OTP verified, but no reset session was returned. Please request a new OTP.","error");return;}
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step3").classList.remove("hidden");
    setMsg("OTP verified. Enter your new password.","success");
    setTimeout(()=>document.getElementById("password").focus(),50);
  }catch(error){
    console.error("Verify OTP:",error);
    setMsg("Could not verify OTP. Please try again.","error");
  }finally{setBusy("verifyOtpBtn",false);}
}

async function resetPassword(){
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;
  if(password.length<6){setMsg("Password must be at least 6 characters.","error");return;}
  if(password!==confirm){setMsg("Passwords do not match.","error");return;}
  if(!token){setMsg("Verify the OTP first.","error");return;}

  setBusy("resetBtn",true,"Resetting...");
  try{
    const response=await fetch("/api/password-reset/complete",{
      method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},credentials:"same-origin",
      body:JSON.stringify({email,resetToken:token,password})
    });
    const data=await readResponse(response);
    if(!response.ok){setMsg(data.error||"Could not reset password.","error");return;}
    setMsg("Password reset successfully. Redirecting to login...","success");
    setTimeout(()=>location.href="/",1000);
  }catch(error){
    console.error("Reset password:",error);
    setMsg("Could not connect to the server. Please try again.","error");
  }finally{setBusy("resetBtn",false);}
}
</script>
</body>
</html>
